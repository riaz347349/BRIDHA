<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bridha – AR Dress Visualiser</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="loading-content">
                <div class="bridha-logo">BRIDHA</div>
                <p class="loading-tagline">AR Dress Visualiser</p>
                <div class="loading-spinner"></div>
                <p class="loading-text" id="loading-text">Starting camera…</p>
            </div>
        </div>

        <!-- Permission Error Screen -->
        <div id="error-screen" class="hidden">
            <div class="error-content">
                <div class="bridha-logo">BRIDHA</div>
                <div class="error-icon">📷</div>
                <h2>Camera Access Needed</h2>
                <p>Please allow camera access to use the AR dress visualiser, then reload the page.</p>
                <button onclick="location.reload()">Try Again</button>
            </div>
        </div>

        <!-- Main AR View -->
        <div id="ar-view" class="hidden">

            <!-- Camera + Canvas -->
            <div class="camera-wrap">
                <video id="video" playsinline autoplay muted></video>
                <canvas id="canvas"></canvas>

                <!-- Guide overlay when no pose -->
                <div id="guide-overlay" class="guide-overlay">
                    <div class="guide-frame"></div>
                    <p id="guide-text">Step back so your full body is visible</p>
                </div>
            </div>

            <!-- Top bar -->
            <header class="top-bar">
                <span class="logo">BRIDHA</span>
                <div class="dress-label">
                    <span id="dress-name">Select a dress</span>
                    <span id="dress-designer"></span>
                </div>
                <button class="capture-btn" id="capture-btn" title="Save photo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    </svg>
                </button>
            </header>

            <!-- Opacity slider -->
            <div class="opacity-control">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                <input type="range" id="opacity-slider" min="30" max="100" value="88" title="Dress opacity">
            </div>

            <!-- Bottom panel -->
            <div class="bottom-panel">
                <!-- Designer tabs -->
                <div class="designer-tabs" role="tablist">
                    <button class="tab active" data-designer="all" role="tab">All</button>
                    <button class="tab" data-designer="pronovias" role="tab">Pronovias</button>
                    <button class="tab" data-designer="maggie-sottero" role="tab">Maggie Sottero</button>
                    <button class="tab" data-designer="richard-designs" role="tab">Richard Designs</button>
                </div>

                <!-- Dress carousel -->
                <div class="dress-carousel" id="dress-carousel" role="listbox" aria-label="Dress selection"></div>
            </div>

        </div>
    </div>

    <!-- TensorFlow.js (full bundle includes core, converter, webgl & wasm) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

    <script src="js/catalog.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
